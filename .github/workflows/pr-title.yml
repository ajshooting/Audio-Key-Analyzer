name: Validate PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a Conventional Commits style title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR titles must use Conventional Commits style."
            echo "Examples:"
            echo "  feat: add a new analysis option"
            echo "  fix(audio): correct stereo downmix"
            echo "  docs: document the release process"
            exit 1
          fi
