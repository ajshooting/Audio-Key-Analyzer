changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "New features"
      labels:
        - enhancement
        - feature
    - title: "Bug fixes"
      labels:
        - bug
        - fix
    - title: "Documentation"
      labels:
        - documentation
    - title: "Maintenance"
      labels:
        - maintenance
        - dependencies
        - chore
    - title: "Other changes"
      labels:
        - "*"
